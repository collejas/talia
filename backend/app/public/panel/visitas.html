<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b1020" />
  <title>TalIA • Visitas Webchat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/api/shared/logos/Logo8.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/api/shared/logos/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/api/shared/logos/favicon-16.png" />
  <link rel="icon" type="image/x-icon" href="/api/shared/logos/favicon.ico" />
  <link rel="apple-touch-icon" href="/api/shared/logos/Logo7.png" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <script src="/api/panel/env.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./assets/js/config.js"></script>
  <style>
    body.o_web_client{
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
      background:var(--bg);
      color:var(--fg);
    }
    .o_action{max-width:1240px;margin:0 auto;padding:32px 24px 48px;display:flex;flex-direction:column;gap:24px}
    .o_control_panel{display:flex;flex-direction:column;gap:18px}
    .o_searchview{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:16px;border-radius:14px;border:1px solid var(--border-soft);background:var(--surface);box-shadow:0 18px 36px rgba(0,0,0,.28)}
    .o_searchview_field{display:flex;flex-direction:column;gap:6px}
    .o_searchview_field span{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
    .o_searchview_full{flex:1;min-width:220px}
    .o_searchview input,
    .o_searchview select{min-width:120px;border-radius:10px;border:1px solid var(--border-soft);padding:8px 10px;background:var(--surface-alt);color:var(--fg);font-size:13px}
    .o_searchview input:focus,
    .o_searchview select:focus{outline:2px solid var(--primary);outline-offset:1px}
    .o_searchview_actions{display:flex;gap:10px;margin-left:auto;align-items:flex-end}
    .o_btn_primary{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.2s}
    .o_btn_primary:hover{filter:brightness(1.1)}
    .o_btn_primary:disabled{opacity:.6;cursor:not-allowed}
    .o_btn_secondary{background:transparent;border:1px solid var(--border-soft);color:var(--fg);border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;transition:.2s}
    .o_btn_secondary:hover{background:rgba(255,255,255,.08)}
    .o_content{display:flex;flex-direction:column;gap:18px}
    .o_list_view{background:var(--surface);border-radius:16px;border:1px solid var(--border-soft);box-shadow:0 24px 48px rgba(0,0,0,.32);overflow:hidden}
    .o_view_loading{padding:14px 18px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--border-soft);display:none}
    .o_view_loading.is-visible{display:block}
    .o_view_empty{padding:28px;text-align:center;font-size:14px;color:var(--muted);border-bottom:1px solid var(--border-soft);display:none}
    .o_view_empty.is-visible{display:block}
    .o_view_table_wrapper{overflow-x:auto}
    .o_list_table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;table-layout:fixed}
    .o_list_table th{background:var(--surface-alt);color:var(--primary);font-weight:600;padding:12px 20px 12px 16px;border-bottom:1px solid var(--border-soft);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;text-align:left;position:relative;user-select:none}
    .o_list_table td{padding:12px 16px;border-bottom:1px solid var(--border-soft);color:var(--fg);vertical-align:top;overflow:hidden;text-overflow:ellipsis;word-break:break-word;position:relative}
    .o_list_table tbody tr:hover{background:rgba(106,163,255,.12)}
    .o_list_table td code{background:transparent;color:var(--fg)}
    .o_list_table td.muted{color:var(--muted)}
    .o_list_table td.monospace{font-family:'JetBrains Mono','Fira Code',Menlo,Consolas,monospace}
    .o_list_table td.multiline{white-space:pre-line;overflow:hidden;text-overflow:clip}
    .o_list_table td.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .o_list_table td.break-word{word-break:break-word}
    .o_list_table th .o_resize_handle{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;user-select:none}
    .o_list_table th .o_resize_handle::after{content:'';position:absolute;top:25%;bottom:25%;left:2px;width:2px;background:rgba(106,163,255,.4);border-radius:2px;opacity:0;transition:.15s}
    .o_list_table th:hover .o_resize_handle::after,
    .o_list_table th.is-resizing .o_resize_handle::after{opacity:1}
    .o_list_table th.is-resizing{background:rgba(106,163,255,.18)}
    .o_pager{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface-alt);border-top:1px solid var(--border-soft);font-size:13px;color:var(--muted)}
    .o_pager_controls{display:flex;gap:10px}
    .o_pager button{background:transparent;border:1px solid var(--border-soft);border-radius:8px;padding:8px 14px;color:var(--fg);font-weight:600;cursor:pointer;transition:.2s}
    .o_pager button:hover{background:rgba(106,163,255,.12);color:var(--primary)}
    .o_pager button:disabled{opacity:.45;cursor:not-allowed;background:rgba(255,255,255,.04)}
    @media (max-width:900px){
      .o_action{padding:24px 16px 36px}
      .o_searchview{flex-direction:column;align-items:stretch}
      .o_searchview_actions{margin-left:0;justify-content:flex-end}
    }
  </style>
</head>
<body class="o_web_client theme-aurora" data-nav="visitas">
  <main class="o_action">
    <header class="o_control_panel">
      <form id="visitas-filters-form" class="o_searchview" novalidate>
        <label class="o_searchview_field">
          <span>Período</span>
          <select id="visitas-range">
            <option value="">Todos</option>
            <option value="hoy">Hoy</option>
            <option value="ayer">Ayer</option>
            <option value="7d" selected>Últimos 7 días</option>
            <option value="30d">Últimos 30 días</option>
          </select>
        </label>
        <label class="o_searchview_field">
          <span>Chat</span>
          <select id="visitas-chat">
            <option value="all" selected>Todos</option>
            <option value="with">Con chat</option>
            <option value="without">Sin chat</option>
          </select>
        </label>
        <label class="o_searchview_field">
          <span>Estado (CVE)</span>
          <input type="text" id="visitas-state" maxlength="3" placeholder="Ej. 09" />
        </label>
        <label class="o_searchview_field o_searchview_full">
          <span>Buscar</span>
          <input type="search" id="visitas-search" placeholder="Sesión, contacto, referrer..." />
        </label>
        <div class="o_searchview_actions">
          <button type="button" class="o_btn_secondary" id="visitas-refresh">Actualizar</button>
          <button type="submit" class="o_btn_primary">Aplicar</button>
          <button type="button" class="o_btn_secondary" id="visitas-reset">Limpiar</button>
        </div>
      </form>
    </header>

    <section class="o_content">
      <div class="o_list_view" aria-label="Listado de visitas webchat">
        <div class="o_view_loading" id="visitas-loading">Cargando visitas…</div>
        <div class="o_view_empty" id="visitas-empty">No se encontraron visitas con los filtros actuales.</div>
        <div class="o_view_table_wrapper">
          <table class="o_list_table" aria-describedby="visitas-total-label">
            <thead>
              <tr>
                <th>Sesión</th>
                <th>IP</th>
                <th>Visitas</th>
                <th>Primera visita</th>
                <th>Último evento</th>
                <th>Tiempo estancia</th>
                <th>Estancia promedio</th>
                <th>Chat</th>
                <th>Contacto</th>
                <th>País</th>
                <th>Estado</th>
                <th>Ciudad</th>
                <th>Dispositivo</th>
                <th>Referrer</th>
                <th>Landing</th>
              </tr>
            </thead>
            <tbody id="visitas-table-body">
              <tr><td colspan="15" class="muted">Cargando…</td></tr>
            </tbody>
          </table>
        </div>
        <footer class="o_pager">
          <div class="o_pager_info" id="visitas-pager-info">0 resultados</div>
          <div class="o_pager_controls">
            <button type="button" id="visitas-pager-prev" aria-label="Página anterior">Anterior</button>
            <button type="button" id="visitas-pager-next" aria-label="Página siguiente">Siguiente</button>
          </div>
        </footer>
      </div>
    </section>
  </main>

  <script type="module">
    import { ensureSession, setActiveNav } from './assets/js/common.js';
    import { setupVisitas } from './assets/js/visitas.js';
    (async () => {
      await ensureSession();
      setActiveNav(document.body.dataset.nav || '');
      setupVisitas();
    })();
  </script>
</body>
</html>
