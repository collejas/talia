name: Backend Scoring CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

jobs:
  scoring-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Install dependencies
        run: poetry install --no-interaction --no-ansi

      - name: Run scoring test suite
        run: >
          poetry run pytest -q
          tests/services/test_lead_scoring_runtime.py
          tests/api/test_crm_scoring_kpis.py
          tests/channels/test_whatsapp_tools.py
          tests/assistants/test_lead_tools.py
