server {
    # Redirecciona www -> no-www (HTTPS)
    server_name www.talia.mx;

    return 301 https://talia.mx$request_uri;

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/talia.mx/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/talia.mx/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name talia.mx;

    root /var/www/talia-landing;
    index index.html;
    client_max_body_size 20m;

    add_header X-Content-Type-Options "nosniff";

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    location ^~ /auth/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    }

    # =========== Backend FastAPI ===========
    location ^~ /api/whatsapp/ {
